name: AI Docs Draft PRs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Source Watch start date, YYYY-MM-DD"
        required: false
      days:
        description: "Days back when since is empty"
        required: false
        default: "7"
      model:
        description: "Optional AI model ID; provider default is used when empty"
        required: false
      provider:
        description: "AI provider: openai, openrouter, or github-models"
        required: false
        default: "openai"
      max_pages:
        description: "Maximum page draft PRs to attempt"
        required: false
        default: "3"
      max_requests:
        description: "Total model request cap, including retries"
        required: false
        default: "9"
      max_output_tokens:
        description: "Output token cap per model request"
        required: false
        default: "12000"
      run_timeout:
        description: "Automation execution budget in seconds"
        required: false
        default: "600"
      resume_run_id:
        description: "Optional prior Actions run ID whose checkpoint artifact should be revalidated"
        required: false
      repo:
        description: "Optional watched source repo filter, owner/name"
        required: false
      page:
        description: "Optional docs page/path fragment filter"
        required: false
      max_queries:
        description: "Optional Source Watch path-query cap"
        required: false
      dry_run:
        description: "Generate AI decisions without pushing PRs"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      include_open_prs:
        description: "Include open pull requests as evidence for explicit latest-work/roadmap testing"
        required: false
        default: "false"

concurrency:
  group: docs-source-watch
  cancel-in-progress: false

jobs:
  draft:
    name: Create AI-assisted draft docs PRs
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
      models: read

    env:
      GITHUB_TOKEN: ${{ secrets.DOCS_BOT_TOKEN || github.token }}
      GH_TOKEN: ${{ secrets.DOCS_BOT_TOKEN || github.token }}
      REPORT_DIR: ai-docs-draft-prs
      AI_PROVIDER: ${{ github.event.inputs.provider || 'openai' }}
      MODEL: ${{ github.event.inputs.model || '' }}
      MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
      MAX_REQUESTS: ${{ github.event.inputs.max_requests || '9' }}
      MAX_OUTPUT_TOKENS: ${{ github.event.inputs.max_output_tokens || '12000' }}
      RUN_TIMEOUT: ${{ github.event.inputs.run_timeout || '600' }}
      RESUME_RUN_ID: ${{ github.event.inputs.resume_run_id || '' }}
      REPO_FILTER: ${{ github.event.inputs.repo || '' }}
      PAGE_FILTER: ${{ github.event.inputs.page || '' }}
      MAX_QUERIES: ${{ github.event.inputs.max_queries || '' }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
      INCLUDE_OPEN_PRS: ${{ github.event.inputs.include_open_prs || 'false' }}
      SCAN_DAYS: ${{ github.event.inputs.days || '7' }}
      SCAN_SINCE: ${{ github.event.inputs.since || '' }}
      BASE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.DOCS_BOT_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure git author
        run: |
          git config user.name "ergodocs automation"
          git config user.email "actions@github.com"

      - name: Resolve scan window
        id: window
        run: |
          if [ -n "$SCAN_SINCE" ]; then
            SINCE="$SCAN_SINCE"
          else
            SINCE="$(date -u -d "$SCAN_DAYS days ago" +%F)"
          fi
          mkdir -p "$REPORT_DIR"
          echo "since=$SINCE" >> "$GITHUB_OUTPUT"

      - name: Scan all watched source repos
        env:
          SOURCE_SINCE: ${{ steps.window.outputs.since }}
        run: |
          EXTRA_SCAN_ARGS=(--no-open-prs)
          if [ "$INCLUDE_OPEN_PRS" = "true" ]; then
            EXTRA_SCAN_ARGS=(--open-prs --open-pr-owner ergoplatform --open-pr-owner ScorexFoundation)
          fi
          if [ -n "$REPO_FILTER" ]; then
            EXTRA_SCAN_ARGS+=(--repo "$REPO_FILTER")
          fi
          if [ -n "$PAGE_FILTER" ]; then
            EXTRA_SCAN_ARGS+=(--page "$PAGE_FILTER")
          fi
          if [ -n "$MAX_QUERIES" ]; then
            EXTRA_SCAN_ARGS+=(--max-queries "$MAX_QUERIES")
          fi
          python tools/source_watch.py scan \
            --github \
            --since "$SOURCE_SINCE" \
            --watch-mode narrow \
            --release-owner ergoplatform \
            --release-owner ScorexFoundation \
            --format json \
            --output "$REPORT_DIR/source-watch.json" \
            --no-fail-on-changes \
            "${EXTRA_SCAN_ARGS[@]}"

      - name: Restore prior checkpoint
        if: github.event.inputs.resume_run_id != ''
        run: |
          if [[ ! "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "resume_run_id must be a numeric Actions run ID" >&2
            exit 2
          fi
          gh run download "$RESUME_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name ai-docs-draft-prs \
            --dir "$REPORT_DIR/resume"
          cp "$REPORT_DIR/resume/ai-docs-draft-prs.json" "$REPORT_DIR/ai-docs-draft-prs.json.restoring"
          mv "$REPORT_DIR/ai-docs-draft-prs.json.restoring" "$REPORT_DIR/ai-docs-draft-prs.json"
          rm -rf "$REPORT_DIR/resume"

      - name: Create AI-assisted draft PRs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$RESUME_RUN_ID" ]; then
            EXTRA_ARGS+=(--resume)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS+=(--dry-run)
          fi
          if [ "$INCLUDE_OPEN_PRS" = "true" ]; then
            EXTRA_ARGS+=(--include-open-prs)
          fi
          python tools/ai_docs_draft_prs.py \
            --report "$REPORT_DIR/source-watch.json" \
            --repo "$GITHUB_REPOSITORY" \
            --provider "$AI_PROVIDER" \
            --model "$MODEL" \
            --base-branch "$BASE_BRANCH" \
            --max-pages "$MAX_PAGES" \
            --max-requests "$MAX_REQUESTS" \
            --max-output-tokens "$MAX_OUTPUT_TOKENS" \
            --run-timeout "$RUN_TIMEOUT" \
            --output "$REPORT_DIR/ai-docs-draft-prs.json" \
            "${EXTRA_ARGS[@]}"

      - name: Write run summary
        if: always()
        env:
          SOURCE_SINCE: ${{ steps.window.outputs.since }}
        run: |
          SUMMARY_MODEL="$MODEL"
          if [ -z "$SUMMARY_MODEL" ] && [ "$AI_PROVIDER" = "github-models" ]; then
            SUMMARY_MODEL="openai/gpt-4.1 (provider default)"
          elif [ -z "$SUMMARY_MODEL" ] && [ "$AI_PROVIDER" = "openrouter" ]; then
            SUMMARY_MODEL="openrouter/free (provider default)"
          elif [ -z "$SUMMARY_MODEL" ]; then
            SUMMARY_MODEL="gpt-5.4-mini (provider default)"
          fi
          {
            echo "## AI Docs Draft PRs"
            echo
            echo "- Since: \`$SOURCE_SINCE\`"
            echo "- Provider: \`$AI_PROVIDER\`"
            echo "- Model: \`$SUMMARY_MODEL\`"
            echo "- Max pages: \`$MAX_PAGES\`"
            echo "- Max model requests: \`$MAX_REQUESTS\`"
            echo "- Max output tokens per request: \`$MAX_OUTPUT_TOKENS\`"
            echo "- Execution budget seconds: \`$RUN_TIMEOUT\`"
            echo "- Resume run: \`${RESUME_RUN_ID:-none}\`"
            echo "- Repo filter: \`${REPO_FILTER:-none}\`"
            echo "- Page filter: \`${PAGE_FILTER:-none}\`"
            echo "- Max queries: \`${MAX_QUERIES:-none}\`"
            echo "- Dry run: \`$DRY_RUN\`"
            echo "- Include open PRs: \`$INCLUDE_OPEN_PRS\`"
            echo
            if [ -f "$REPORT_DIR/ai-docs-draft-prs.json" ]; then
              echo "### Results"
              echo
              echo '```json'
              cat "$REPORT_DIR/ai-docs-draft-prs.json"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-docs-draft-prs
          path: ai-docs-draft-prs/
